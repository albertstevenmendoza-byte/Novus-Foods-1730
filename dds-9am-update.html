<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>9AM Production Update – Novus Foods Ops Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="novus-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="novus-core.js"></script>
  <style>
    .page { padding-top:24px; }
    .page-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .page-title { font-size:2rem; font-weight:800; color:var(--ink); letter-spacing:-.04em; }
    .sync-meta { font-size:.72rem; font-family:var(--mono); color:var(--ink4); display:flex; align-items:center; gap:10px; }

    /* ── Toolbar: line tabs + live/range toggle ── */
    .nine-am-toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
    .line-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .line-tab {
      padding:7px 16px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface); color:var(--text-3); font-weight:700; font-size:.78rem;
      cursor:pointer; transition:all .15s; font-family:var(--font);
    }
    .line-tab:hover { border-color:var(--border-2); color:var(--text-1); }
    .line-tab.active { background:var(--green-xll); border-color:var(--green-ll); color:var(--green-d); }

    .mode-toggle { display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px; flex-shrink:0; }
    .mode-btn { padding:6px 14px; border-radius:6px; border:none; background:transparent; color:var(--text-3); font-weight:700; font-size:.76rem; cursor:pointer; font-family:var(--font); }
    .mode-btn.active { background:var(--surface); color:var(--text-1); box-shadow:var(--shadow-xs); }

    .range-picker { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .range-picker input[type=date] { font:inherit; padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); }
    .range-picker span { color:var(--ink4); font-size:.8rem; }

    .stale-banner {
      background:#fffbeb; border:1px solid rgba(217,119,6,.25); color:#92400e;
      padding:9px 14px; border-radius:var(--radius-sm); font-size:.8rem;
      margin-bottom:16px; display:flex; align-items:center; gap:8px;
    }
    .stale-banner::before { content:'⚠'; }

    /* ── OEE meter ── */
    .oee-meter { display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 4px 4px; }
    .oee-value { font-size:3.4rem; font-weight:800; letter-spacing:-.03em; color:var(--text-1); font-family:var(--mono); line-height:1; }
    .oee-status { display:flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:4px 12px; border-radius:20px; }
    .oee-status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .oee-status.good { background:rgba(22,163,74,.1); color:#15803d; }
    .oee-status.good .oee-status-dot { background:#16a34a; }
    .oee-status.warn { background:var(--amber-ll); color:#92400e; }
    .oee-status.warn .oee-status-dot { background:var(--amber-l); }
    .oee-status.bad { background:var(--red-ll); color:#991b1b; }
    .oee-status.bad .oee-status-dot { background:var(--red); }
    .oee-status.unknown { background:var(--surface-3); color:var(--text-4); }
    .oee-status.unknown .oee-status-dot { background:var(--text-4); }
    .oee-bar-track { width:100%; height:10px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:6px; }
    .oee-bar-fill { height:100%; border-radius:6px; width:0%; transition:width .4s ease, background .3s; background:#16a34a; }
    .oee-bar-scale { width:100%; display:flex; justify-content:space-between; font-size:.62rem; color:var(--text-4); font-family:var(--mono); }

    /* ── Downtime breakdown ── */
    .downtime-total { display:flex; align-items:baseline; gap:8px; margin-bottom:12px; }
    .downtime-total-val { font-size:2rem; font-weight:800; font-family:var(--mono); color:var(--text-1); }
    .downtime-total-label { font-size:.74rem; color:var(--text-3); }
    .downtime-bar { display:flex; height:22px; border-radius:6px; overflow:hidden; background:var(--surface-3); margin-bottom:10px; }
    .downtime-seg { height:100%; transition:width .4s ease; }
    .downtime-seg.red { background:var(--red); }
    .downtime-seg.yellow { background:var(--amber-l); }
    .downtime-seg.other { background:var(--text-4); }
    .downtime-legend { display:flex; gap:16px; flex-wrap:wrap; }
    .dt-legend-item { display:flex; align-items:center; gap:6px; font-size:.76rem; color:var(--text-2); }
    .dt-legend-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  </style>
</head>
<body>

<div class="page">
  <div class="page-top">
    <h1 class="page-title">9AM Production Update</h1>
    <div class="sync-meta">
      <span id="conn-status">Connecting…</span>
      <span id="last-updated"></span>
      <button class="btn-cmd btn-cmd-ghost" style="font-size:.72rem;padding:5px 11px;" onclick="loadCurrent()">↺ Refresh</button>
    </div>
  </div>

  <div class="nine-am-toolbar">
    <nav class="line-tabs" id="line-tabs"></nav>
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-live-btn" onclick="setMode('live')">Live</button>
      <button class="mode-btn" id="mode-range-btn" onclick="setMode('range')">Date Range</button>
    </div>
  </div>

  <div class="range-picker hidden" id="range-picker">
    <input type="date" id="range-start">
    <span>to</span>
    <input type="date" id="range-end">
    <button class="btn-cmd btn-cmd-primary" onclick="loadRange()">View</button>
  </div>

  <div class="stale-banner hidden" id="stale-banner"></div>

  <div class="dash-grid">
    <div class="panel" style="grid-column:span 5;">
      <div class="panel-header"><span class="panel-title">⚙️ OEE — <span id="oee-line-label">2A</span></span></div>
      <div class="panel-body">
        <div class="oee-meter">
          <div class="oee-value" id="oee-value">—</div>
          <div class="oee-status unknown" id="oee-status-pill"><span class="oee-status-dot"></span><span id="oee-status-text">No data</span></div>
          <div class="oee-bar-track"><div class="oee-bar-fill" id="oee-bar-fill"></div></div>
          <div class="oee-bar-scale"><span>0</span><span>50</span><span>100</span></div>
        </div>
      </div>
    </div>

    <div class="panel" style="grid-column:span 7;">
      <div class="panel-header"><span class="panel-title">⏱ Downtime Breakdown</span></div>
      <div class="panel-body">
        <div class="downtime-total"><span class="downtime-total-val" id="downtime-total">—</span><span class="downtime-total-label">total minutes down</span></div>
        <div class="downtime-bar" id="downtime-bar"></div>
        <div class="downtime-legend" id="downtime-legend">
          <div class="dt-legend-item"><span class="dt-legend-dot" style="background:var(--red);"></span>Code Red <span id="legend-red">—</span></div>
          <div class="dt-legend-item"><span class="dt-legend-dot" style="background:var(--amber-l);"></span>Code Yellow <span id="legend-yellow">—</span></div>
          <div class="dt-legend-item"><span class="dt-legend-dot" style="background:var(--text-4);"></span>Other <span id="legend-other">—</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   9AM Production Update
   Pulls live OEE + downtime straight from L2L via a Supabase Edge
   Function proxy (never calls L2L directly from the browser -- that
   would expose the API key and hit CORS). This page is independent of
   dashboard-data.json / Power Automate; it only ever talks to L2L.

   NOTE: the exact JSON shape the proxy returns hasn't been verified
   against a live call yet. extractMetrics() below tries several
   common key-name variants (raw L2L field names AND friendlier
   aliases) so it has a good chance of working as-is, but if real data
   comes back looking wrong, open DevTools → Network, click the
   "hyper-api" request, and adjust the key lists in extractMetrics()
   to match what's actually there.
   ═══════════════════════════════════════════════════════════════════ */

const CONFIG = {
  SITE_NUMBER: 2,
  PROXY_URL: 'https://ymwiylhpxryrmqgkzxth.supabase.co/functions/v1/hyper-api',
  LINES: [
    { name: '2A',   code: 'BP-LINE1' },
    { name: 'PXM6', code: 'BP-LINE2' },
    { name: 'MP4',  code: 'BP-LINE3' },
    { name: 'PL1',  code: 'BP-LINE4' },
    { name: 'PL2',  code: 'BP-LINE5' },
    { name: '2E',   code: 'BP-LINE6' }
  ],
  OEE_GOOD: 85,
  OEE_WARN: 65,
  REFRESH_INTERVAL_MS: 60000
};

let currentLine = CONFIG.LINES[0];
let mode = 'live';
let liveTimer = null;
let lastGood = null; // { oee, downtimeTotal, codeRed, codeYellow, other, ts }

function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function firstDefined(obj, keys) { for (const k of keys) { if (obj && obj[k] != null) return obj[k]; } return null; }

function initLineTabs() {
  const nav = document.getElementById('line-tabs');
  nav.innerHTML = CONFIG.LINES.map(l =>
    `<button class="line-tab${l.code === currentLine.code ? ' active' : ''}" data-code="${l.code}" onclick="selectLine('${l.code}')">${l.name}</button>`
  ).join('');
}

function selectLine(code) {
  currentLine = CONFIG.LINES.find(l => l.code === code) || currentLine;
  document.querySelectorAll('.line-tab').forEach(b => b.classList.toggle('active', b.dataset.code === code));
  document.getElementById('oee-line-label').textContent = currentLine.name;
  lastGood = null;
  if (mode === 'live') loadCurrent(); else loadRange();
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-live-btn').classList.toggle('active', m === 'live');
  document.getElementById('mode-range-btn').classList.toggle('active', m === 'range');
  document.getElementById('range-picker').classList.toggle('hidden', m !== 'range');
  if (m === 'live') {
    loadCurrent();
    startLiveTimer();
  } else {
    stopLiveTimer();
    const today = fmtDate(new Date());
    if (!document.getElementById('range-start').value) document.getElementById('range-start').value = today;
    if (!document.getElementById('range-end').value) document.getElementById('range-end').value = today;
  }
}

function startLiveTimer() { stopLiveTimer(); liveTimer = setInterval(loadCurrent, CONFIG.REFRESH_INTERVAL_MS); }
function stopLiveTimer() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

async function fetchLineData(startStr, endStr) {
  const url = `${CONFIG.PROXY_URL}?line=${encodeURIComponent(currentLine.code)}&site=${CONFIG.SITE_NUMBER}&start=${encodeURIComponent(startStr)}&end=${encodeURIComponent(endStr)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Proxy returned ' + res.status);
  return res.json();
}

// Confirmed live shape (checked via DevTools Network tab against the real
// proxy): a single flat object per line/date-range, already pre-aggregated
// server-side --
//   { oee, total_dt, red_dt, yellow_dt, day_count, range_start, range_end, updated_at }
// oee comes back as a plain percentage (e.g. 38, meaning 38%), and
// total_dt/red_dt/yellow_dt are minutes, not dispatch counts.
function extractMetrics(payload) {
  if (!payload || typeof payload !== 'object') return { oee: null, downtimeTotal: null, codeRed: 0, codeYellow: 0, other: 0, ts: new Date() };

  const oeeRaw = firstDefined(payload, ['oee', 'OEE', 'overall_equipment_effectiveness']);
  let oee = null;
  if (oeeRaw != null && !isNaN(Number(oeeRaw))) {
    const v = Number(oeeRaw);
    oee = v <= 2 ? v * 100 : v; // defensive: handle a 0-1 fraction if it's ever sent that way
  }

  const totalRaw = firstDefined(payload, ['total_dt', 'downtimeTotal', 'downtime_minutes', 'downtime']);
  const redRaw   = firstDefined(payload, ['red_dt', 'codeRed', 'code_red']);
  const yellowRaw= firstDefined(payload, ['yellow_dt', 'codeYellow', 'code_yellow']);

  const downtimeTotal = totalRaw != null && !isNaN(Number(totalRaw)) ? Number(totalRaw) : null;
  const codeRed = redRaw != null && !isNaN(Number(redRaw)) ? Number(redRaw) : 0;
  const codeYellow = yellowRaw != null && !isNaN(Number(yellowRaw)) ? Number(yellowRaw) : 0;
  // total_dt has been seen not to fully cover red_dt+yellow_dt on the live
  // proxy -- widen the bar's denominator rather than clipping real minutes.
  const other = Math.max(0, (downtimeTotal || 0) - (codeRed + codeYellow));

  return { oee, downtimeTotal, codeRed, codeYellow, other, ts: new Date() };
}

async function loadCurrent() {
  const today = new Date();
  const start = fmtDate(today) + ' 00:00';
  const end = fmtDate(new Date(today.getTime() + 86400000)) + ' 00:00';
  setStatus('Connecting…');
  try {
    const payload = await fetchLineData(start, end);
    const m = extractMetrics(payload);
    lastGood = m;
    render(m);
    hideStaleBanner();
    setStatus('Live');
  } catch (err) {
    console.error('9am update fetch failed', err);
    if (lastGood) { render(lastGood); showStaleBanner(lastGood.ts); }
    else { renderEmpty(); showStaleBanner(null); }
    setStatus('Connection error');
  }
}

async function loadRange() {
  const s = document.getElementById('range-start').value;
  const e = document.getElementById('range-end').value;
  if (!s || !e) return;
  const today = fmtDate(new Date());
  if (s > today || e > today) { alert('Date range cannot go beyond today.'); return; }
  setStatus('Loading range…');
  try {
    const payload = await fetchLineData(s + ' 00:00', e + ' 00:00');
    const m = extractMetrics(payload);
    lastGood = m;
    render(m);
    hideStaleBanner();
    setStatus(`Showing ${s} → ${e}`);
  } catch (err) {
    console.error('9am update range fetch failed', err);
    renderEmpty();
    showStaleBanner(null);
    setStatus('Connection error');
  }
}

function setStatus(text) {
  const el = document.getElementById('conn-status');
  if (el) el.textContent = text;
  const lu = document.getElementById('last-updated');
  if (lu) lu.textContent = lastGood ? ('Updated ' + lastGood.ts.toLocaleTimeString()) : '';
}

function showStaleBanner(ts) {
  const el = document.getElementById('stale-banner');
  el.textContent = ts
    ? `Can't reach L2L right now — showing data from ${ts.toLocaleTimeString()}.`
    : `Can't reach L2L right now.`;
  el.classList.remove('hidden');
}
function hideStaleBanner() { document.getElementById('stale-banner').classList.add('hidden'); }

function statusClass(oee) {
  if (oee == null) return 'unknown';
  if (oee >= CONFIG.OEE_GOOD) return 'good';
  if (oee >= CONFIG.OEE_WARN) return 'warn';
  return 'bad';
}
function statusLabel(cls) {
  return { good: 'On Target', warn: 'Below Target', bad: 'Critical', unknown: 'No data' }[cls];
}
function statusFill(cls) {
  return { good: '#16a34a', warn: 'var(--amber-l)', bad: 'var(--red)', unknown: 'var(--text-4)' }[cls];
}

function render(m) {
  const cls = statusClass(m.oee);
  document.getElementById('oee-value').textContent = m.oee != null ? Math.round(m.oee) + '%' : '—';
  const pill = document.getElementById('oee-status-pill');
  pill.className = 'oee-status ' + cls;
  document.getElementById('oee-status-text').textContent = statusLabel(cls);
  const fill = document.getElementById('oee-bar-fill');
  fill.style.width = (m.oee != null ? Math.min(100, Math.max(0, m.oee)) : 0) + '%';
  fill.style.background = statusFill(cls);

  // total_dt from the proxy has been seen to under-report vs red_dt+yellow_dt
  // on some days -- show whichever is larger so the headline number is never
  // smaller than what the legend below it adds up to.
  const total = (m.codeRed || 0) + (m.codeYellow || 0) + (m.other || 0);
  const headlineTotal = Math.max(m.downtimeTotal || 0, total);
  document.getElementById('downtime-total').textContent = (m.downtimeTotal != null || total > 0) ? Math.round(headlineTotal) : '—';
  const bar = document.getElementById('downtime-bar');
  if (total > 0) {
    bar.innerHTML = `
      <div class="downtime-seg red" style="width:${(m.codeRed / total * 100).toFixed(1)}%"></div>
      <div class="downtime-seg yellow" style="width:${(m.codeYellow / total * 100).toFixed(1)}%"></div>
      <div class="downtime-seg other" style="width:${(m.other / total * 100).toFixed(1)}%"></div>`;
  } else {
    bar.innerHTML = '';
  }
  document.getElementById('legend-red').textContent = m.codeRed != null ? Math.round(m.codeRed) + 'm' : '—';
  document.getElementById('legend-yellow').textContent = m.codeYellow != null ? Math.round(m.codeYellow) + 'm' : '—';
  document.getElementById('legend-other').textContent = m.other != null ? Math.round(m.other) + 'm' : '—';
}

function renderEmpty() {
  render({ oee: null, downtimeTotal: null, codeRed: null, codeYellow: null, other: null, ts: null });
}

document.addEventListener('DOMContentLoaded', () => {
  NovusCore.requireAuth();
  initLineTabs();
  loadCurrent();
  startLiveTimer();
});
</script>
</body>
</html>
