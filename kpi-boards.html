<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Boards</title>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   THEME TOKENS. Light values on :root; dark values redefined below.
   ===================================================================== */
:root {
  --accent-light: #1f5fd1; --accent-dark: #6ea2ff;
  --accent: var(--accent-light); --accent-ink: #ffffff;
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb; --surface-3: #eaeef5; --line: #dbe0ea;
  --ink: #0f1626; --ink-2: #454f63; --ink-3: #63708a;
  --good: #087a2e; --bad: #c42b2b; --warn: #9a5200;
  --c1: #1f5fd1; --c2: #d9660a; --c3: #0a8f7a; --c4: #a33fb5; --c5: #8a6d00; --c6: #c42b6a;
  --shadow: 0 1px 2px rgba(15, 22, 38, .05), 0 6px 20px rgba(15, 22, 38, .06);
  --shadow-pop: 0 14px 44px rgba(10, 16, 32, .26);
  --radius: 14px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: var(--accent-dark); --accent-ink: #0b1020;
    --bg: #0a0f1b; --surface: #131b2b; --surface-2: #182136; --surface-3: #1f2a42; --line: #263149;
    --ink: #eef1f8; --ink-2: #b2bbce; --ink-3: #8f9bb4;
    --good: #43d65b; --bad: #f58a8a; --warn: #fbb82a;
    --c1: #6ea2ff; --c2: #ff9a52; --c3: #3cc7bd; --c4: #d58cf0; --c5: #e0c24a; --c6: #ff7aa8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
    --shadow-pop: 0 14px 44px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: var(--accent-dark); --accent-ink: #0b1020;
  --bg: #0a0f1b; --surface: #131b2b; --surface-2: #182136; --surface-3: #1f2a42; --line: #263149;
  --ink: #eef1f8; --ink-2: #b2bbce; --ink-3: #8f9bb4;
  --good: #43d65b; --bad: #f58a8a; --warn: #fbb82a;
  --c1: #6ea2ff; --c2: #ff9a52; --c3: #3cc7bd; --c4: #d58cf0; --c5: #e0c24a; --c6: #ff7aa8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  --shadow-pop: 0 14px 44px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 16px; height: 16px; }

/* ---------- shell ---------- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 20; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.logo svg { width: 20px; height: 20px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); line-height: 1.1; }
.brand h1 { font-size: 19px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; position: relative; }
.field { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
select, .field input, .search input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); min-width: 0; max-width: 100%; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; line-height: 1.2; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.icon { padding: 7px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[aria-expanded="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.08); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* board tabs */
.tabs { display: flex; align-items: flex-end; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.btab { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 0; background: none; font-weight: 600; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; border-radius: 8px 8px 0 0; }
.btab:hover { color: var(--ink); background: var(--surface-2); }
.btab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.btab.drop { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); outline: 2px dashed var(--accent); }
.btab .cnt { font-weight: 500; font-size: 12px; color: var(--ink-3); }
.btab-add { padding: 9px 12px; color: var(--ink-3); }
.tabs input { padding: 6px 8px; width: 170px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); margin: 4px 0; }

/* ---------- body: library + stage ---------- */
.body { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.library {
  width: 310px; position: sticky; top: 0; height: 100vh; max-height: 100vh; display: flex; flex-direction: column;
  border-right: 1px solid var(--line); background: var(--surface); }
.library.closed { display: none; }
.body:has(.library.closed) { grid-template-columns: minmax(0, 1fr); }
.lib-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.lib-title { display: flex; align-items: center; justify-content: space-between; }
.lib-title h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.search { position: relative; }
.search input { width: 100%; padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
.lib-tip { font-size: 12px; color: var(--ink-3); }
.tree { flex: 1; overflow-y: auto; padding: 6px 6px 14px; }
.dept-h, .grp-h { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: left; border-radius: 8px; }
.dept-h { padding: 8px 8px 6px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin-top: 6px; }
.grp-h { padding: 6px 8px 6px 14px; font-weight: 600; color: var(--ink); }
.dept-h:hover, .grp-h:hover { background: var(--surface-2); }
.chev { width: 12px; color: var(--ink-3); transition: rotate .12s; display: inline-block; text-align: center; }
[aria-expanded="true"] > .chev { rotate: 90deg; }
.cnt { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--ink-3); }
.lib-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 26px; border-radius: 8px; cursor: grab; position: relative; }
.lib-row.child { padding-left: 46px; }
.lib-row:hover { background: var(--surface-2); }
.lib-row.picked { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.lib-row input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
.lib-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-val { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); } .dot.stale { background: var(--warn); }
.kebab { border: 0; background: none; padding: 2px 5px; border-radius: 6px; color: var(--ink-3); line-height: 1; font-size: 16px; }
.kebab:hover { background: var(--surface-3); color: var(--ink); }
.selbar { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); }
.selbar b { margin-right: auto; }

/* ---------- stage ---------- */
.stage { padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; font-size: var(--fs, 14px); --row: 80px; }
.bhead { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: flex-end; justify-content: space-between; }
.bhead h2 { font-size: clamp(24px, 2.6vw, 38px); line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.bsub { color: var(--ink-2); margin-top: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bactions { display: flex; flex-wrap: wrap; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--row); grid-auto-flow: dense; gap: 14px; position: relative; min-height: 220px; }
.tile {
  grid-column: span var(--cs, 4); grid-row: span var(--rs, 4); position: relative; container-type: inline-size;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px 16px 12px; overflow: hidden;
}
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--st, transparent); }
.st-on { --st: var(--good); } .st-off { --st: var(--bad); } .st-stale { --st: var(--warn); }
.tile.dragging { opacity: .4; }
.tile.drop-before { box-shadow: -7px 0 0 -2px var(--accent), var(--shadow); }
.tile.drop-after { box-shadow: 7px 0 0 -2px var(--accent), var(--shadow); }
.tile.drop-add { outline: 3px dashed var(--accent); outline-offset: -3px; }
.tile.drop-add::after { content: "Drop to compare"; position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); font-weight: 700; font-size: 1.2em; }
.t-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; min-height: 36px; }
.grip { color: var(--ink-3); cursor: grab; padding: 2px 0; opacity: 0; transition: opacity .12s; margin-left: -6px; width: 14px; flex: none; text-align: center; user-select: none; }
.tile:hover .grip, .tile:focus-within .grip { opacity: 1; }
.t-titles { flex: 1; min-width: 0; }
.t-title { font-weight: 600; font-size: 1.07em; line-height: 1.25; overflow-wrap: anywhere; }
.t-sub { font-size: .85em; color: var(--ink-3); }
.t-tools { display: flex; gap: 2px; align-items: center; opacity: 0; transition: opacity .12s; flex: none; }
.tile:hover .t-tools, .tile:focus-within .t-tools { opacity: 1; }
.tbtn { border: 0; background: none; border-radius: 7px; padding: 4px; color: var(--ink-3); display: grid; place-items: center; }
.tbtn:hover { background: var(--surface-3); color: var(--ink); }
.tbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
.t-rename { width: 100%; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); font-weight: 600; }
.t-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.tile .num { font-variant-numeric: tabular-nums; }

/* number tile */
.n-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.n-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.n-val { font-size: clamp(2rem, 17cqw, 4.6rem); line-height: 1; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.n-spark { width: min(42%, 150px); flex: none; }
.n-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .92em; color: var(--ink-2); }
.asof { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); }
.asof.late { color: var(--warn); font-weight: 500; }
.asof svg { width: 12px; height: 12px; }
.chg { font-weight: 600; white-space: nowrap; }
.tone-good { color: var(--good); } .tone-bad { color: var(--bad); } .tone-flat, .tone-neutral { color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: .85em; font-weight: 600; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 9%, var(--surface)); white-space: nowrap; }
.chip svg { width: 11px; height: 11px; }
.chip.on { color: var(--good); } .chip.off { color: var(--bad); } .chip.stale { color: var(--warn); } .chip.none { color: var(--ink-3); }
.spark { width: 100%; height: auto; display: block; overflow: visible; }
.spark path.ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark path.ar { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: none; }
.spark circle { fill: var(--accent); }

/* chart tiles */
.c-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.c-val { font-size: 1.9em; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.1; }
.c-wrap { position: relative; flex: 1; min-height: 0; }
.c-wrap canvas { position: absolute; inset: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.lg { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface-2); font-size: .88em; max-width: 100%; }
.lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc, var(--accent)); flex: none; }
.lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg button { border: 0; background: none; padding: 0 3px; color: var(--ink-3); line-height: 1; border-radius: 4px; }
.lg button:hover { color: var(--bad); }
.hint { font-size: .82em; color: var(--ink-3); }
.hint.warn { color: var(--warn); }
.minis { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; align-content: start; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mini .mn { font-weight: 600; font-size: .92em; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.mini .mn i { width: 9px; height: 9px; border-radius: 3px; background: var(--sc); flex: none; }
.mini .mv { font-size: 1.5em; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.mini .spark path.ln { stroke: var(--sc, var(--accent)); } .mini .spark circle { fill: var(--sc, var(--accent)); } .mini .spark path.ar { fill: color-mix(in srgb, var(--sc, var(--accent)) 12%, transparent); }
.tbl { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: .78em; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); white-space: nowrap; }
tbody tr:last-child > * { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr[data-mid]:hover { background: var(--surface-2); }
.b-ctl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.note { flex: 1; width: 100%; resize: none; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; line-height: 1.5; font-size: 1em; }
.note:focus { outline: none; border-color: var(--accent); border-style: solid; }
.note-read { flex: 1; white-space: pre-wrap; overflow: auto; line-height: 1.55; }
.empty { grid-column: 1 / -1; grid-row: span 4; border: 2px dashed var(--line); border-radius: var(--radius); display: grid; place-items: center; text-align: center; color: var(--ink-2); padding: 24px; }
.empty b { display: block; font-size: 1.15em; color: var(--ink); margin-bottom: 4px; }
.missing { display: grid; place-items: center; text-align: center; color: var(--ink-3); flex: 1; }
body.dragging-metric .grid { outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 6px; border-radius: 8px; }

/* ---------- context menu / popovers / modal / focus ---------- */
.ctx, .pop {
  position: fixed; z-index: 70; min-width: 230px; max-width: min(340px, calc(100vw - 16px)); max-height: min(78vh, 640px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 6px;
}
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); padding: 14px; display: flex; flex-direction: column; gap: 14px; z-index: 60; }
.pop h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 6px; }
.m-h { padding: 7px 10px 3px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.m-title { padding: 7px 10px 6px; font-weight: 600; border-bottom: 1px solid var(--line); margin-bottom: 4px; overflow-wrap: anywhere; }
.m-sep { height: 1px; background: var(--line); margin: 5px 0; }
.m-it { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; }
.m-it:hover, .m-it:focus-visible { background: var(--surface-2); outline: none; }
.m-it.primary { color: var(--accent); font-weight: 600; }
.m-it.danger { color: var(--bad); }
.m-it:disabled { opacity: .45; cursor: not-allowed; }
.m-it .ck { width: 14px; color: var(--accent); flex: none; }
.m-it .hintr { margin-left: auto; color: var(--ink-3); font-size: .85em; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
input[type="color"] { width: 32px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); z-index: 80; display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-pop); width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { font-size: 18px; }
.dlg ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.dlg textarea { width: 100%; min-height: 200px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.focus { width: min(1180px, 100%); }
.focus .grid { --row: 74px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 500; z-index: 120; max-width: calc(100vw - 32px); box-shadow: var(--shadow-pop); }
.banner { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); border: 1px solid var(--bad); border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; align-content: start; margin: 0; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat dt { font-size: .8em; color: var(--ink-3); } .stat dd { margin: 2px 0 0; font-weight: 600; font-size: 1.15em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pnav { display: none; }

/* ---------- present mode ---------- */
.shell.present { --fs: clamp(15px, calc(0.55vw + 9px), 24px); }
.shell.present .topbar .tabs-wrap, .shell.present .library, .shell.present .grip, .shell.present .t-tools, .shell.present .bactions, .shell.present .tool-edit { display: none !important; }
.shell.present .body { grid-template-columns: minmax(0, 1fr); }
.shell.present .stage { padding-top: 22px; --row: max(78px, calc((100vh - 260px) / 9)); }
.shell.present .topbar { padding-bottom: 10px; }
.shell.present .pnav { display: flex; align-items: center; justify-content: center; gap: 14px; position: fixed; bottom: 12px; left: 50%; translate: -50% 0; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 10px; box-shadow: var(--shadow-pop); z-index: 30; }
.pdots { display: flex; gap: 6px; }
.pdots button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: var(--line); padding: 0; }
.pdots button[aria-current="true"] { background: var(--accent); width: 26px; border-radius: 6px; }

/* ---------- responsive ---------- */
.mob-only { display: none; }
@media (max-width: 1100px) { .tile { grid-column: span max(var(--cs, 4), 6); } }
@media (max-width: 860px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .library { position: fixed; z-index: 90; left: 0; top: 0; width: min(340px, 92vw); box-shadow: var(--shadow-pop); }
  .mob-only { display: inline-flex; }
}
@media (max-width: 640px) {
  .stage { padding-inline: 16px; }
  .grid { grid-auto-rows: auto; }
  .tile { grid-column: 1 / -1; grid-row: auto; min-height: var(--mh, 180px); }
  .t-tools, .grip { opacity: 1; }
  .c-wrap { min-height: 220px; }
  .tile.tt-metric:not(.is-chart) { min-height: 170px; }
  .row1 { gap: 8px 10px; }
  .field > span { display: none; }
}
@media (hover: none) { .t-tools, .grip { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* number tiles: tools float over the corner so the title gets the full width */
.grip { position: absolute; left: 4px; top: 14px; margin: 0; }
.tile.tt-metric:not(.is-chart) .t-tools { position: absolute; right: 8px; top: 8px; background: var(--surface); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); padding: 1px; z-index: 2; }
.tile.tt-metric:not(.is-chart) .t-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.n-val { font-size: clamp(1.8rem, 15cqw, 3.8rem); }
.n-val { white-space: nowrap; overflow-wrap: normal; flex: none; }
.n-spark { flex: 1; min-width: 40px; display: flex; justify-content: flex-end; }
.n-spark .spark { width: 100%; max-width: 150px; height: auto; }
.shell.present #btnLib, .shell.present #btnLoad, .shell.present #btnCustom, .shell.present #segSpan, .shell.present .eyebrow { display: none !important; }

/* notes: make them a first-class tile */
.tile.tt-note { border-top: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.tile.tt-note .t-title { font-size: 1.15em; color: var(--accent); }
.note { border: 1.5px solid var(--ink-3); background: var(--surface); color: var(--ink); font-size: 1.15em; line-height: 1.6; padding: 14px 16px; }
.note::placeholder { color: var(--ink-2); opacity: 1; }
.note-read { font-size: 1.3em; line-height: 1.6; color: var(--ink); }
.shell.present .note-read { font-size: 1.6em; }

      var srcOk = S.drag.kind === 'metrics' || (findTile(S.drag.tid) && findTile(S.drag.tid).t.type === 'metric');
      if (mergeable && srcOk && x > 0.25 && x < 0.75) return { add: tile, tid: f.t.id };
      return x < 0.5 ? { at: idx, el: tile, cls: 'drop-before' } : { at: idx + 1, el: tile, cls: 'drop-after' };
    }
    document.addEventListener('dragover', function (e) {
      if (!S.drag) return;
      var tab = e.target.closest('.btab[data-bid]');
      clearDrop();
      if (tab) { e.preventDefault(); tab.classList.add('drop'); S.dropInfo = { tab: tab.dataset.bid }; return; }
      if (!e.target.closest('#grid')) return;
      var di = dropTarget(e); if (!di) return;
      e.preventDefault(); S.dropInfo = di;
      if (di.add) di.add.classList.add('drop-add'); else if (di.el) di.el.classList.add(di.cls);
    });
    document.addEventListener('drop', function (e) {
      if (!S.drag) return;
      var di = S.dropInfo, drag = S.drag; e.preventDefault(); endDrag(); if (!di) return;
      if (drag.kind === 'metrics') {
        if (di.tab) addMetrics(di.tab, drag.ids, 'number');
        else if (di.add) addToCompare(di.tid, drag.ids);
        else addMetrics(S.active, drag.ids, 'number', di.at);
        return;
      }
      var f = findTile(drag.tid); if (!f || !f.board) return;
      if (di.tab) { moveTileTo(drag.tid, di.tab); return; }
      if (di.add) { var ids = f.t.m.slice(); f.board.tiles.splice(f.board.tiles.indexOf(f.t), 1); addToCompare(di.tid, ids); return; }
      var b = f.board, from = b.tiles.indexOf(f.t), at = di.at; b.tiles.splice(from, 1); if (from < at) at--; b.tiles.splice(at, 0, f.t); commit();
    });
    document.addEventListener('dragover', function (e) { if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') > -1) e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      if (S.drag) return;
      var fl = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (fl) { e.preventDefault(); handleFile(fl); }
    });
  }

  /* =====================================================================
     START
     ===================================================================== */
  function start() {
    if (hasChart()) { Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.font.size = 12; }
    var qp = new URLSearchParams(location.search);
    S.plant = qp.get('plant') || '1730';
    if (qp.get('embed')) $('#shell').classList.add('embed');
    if (S.plant !== '1730') CONFIG.STORAGE_KEY += '-' + S.plant;   // boards are kept per plant
    loadPrefs();
    if (window.innerWidth < 900) S.libOpen = false;
    bind();
    window.__kpi = { state: S, fromWorkbook: buildFromWorkbook, loadSheetJS: loadSheetJS };
    var embedded;
    try { embedded = JSON.parse($('#kpi-data').textContent); } catch (e) { embedded = null; }
    if (S.plant !== '1730') embedded = null;   // the built-in snapshot is Plant 1730 only
    applyTheme();
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY + '-data') || 'null'); } catch (e) {}
    var BI = 'weekly_KPIs.xlsx (built-in snapshot)', loaded = false;
    if (embedded) {
      try {
        if (saved && saved.data && saved.data.meta && saved.data.meta.latestWeek >= embedded.meta.latestWeek) useData(saved.data, saved.label + ' · saved in this browser');
        else useData(embedded, BI);
        loaded = true;
      } catch (e) { try { useData(embedded, BI); loaded = true; } catch (e2) { banner(e2.message); } }
    } else if (saved && saved.data) {
      try { useData(saved.data, saved.label + ' · saved in this browser'); loaded = true; } catch (e) {}
    }
    applyTheme();
    if (!hasChart()) banner('Charts could not load (no internet access to the chart library). Numbers and tables still work.');
    // On a web server, a kpi-data.json next to the site wins when it is newer than what is loaded.
    if (/^https?:$/.test(location.protocol) && window.fetch) {
      var url = (S.plant === '1730' ? '' : S.plant + '/') + 'kpi-data.json';
      fetch(url + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (j) {
          if (!j || !j.meta) return;
          if (!loaded || (S.meta && S.meta.latestWeek && j.meta.latestWeek > S.meta.latestWeek)) { useData(j, url + ' (live file)'); loaded = true; banner(''); }
        })
        .catch(function () {
          if (!loaded) banner('No weekly KPI data for Plant ' + S.plant + ' yet. Use Load data to open weekly_KPIs.xlsx, or add ' + url + ' to the site.');
        });
    } else if (!loaded) banner('No data loaded. Use Load data to open weekly_KPIs.xlsx or kpi-data.json.');
  }
  function boot() {
    if (hasChart()) return start();
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js';
    s.onload = start;
    s.onerror = function () { var l = document.createElement('script'); l.src = 'chart.umd.min.js'; l.onload = start; l.onerror = start; document.head.appendChild(l); };
    document.head.appendChild(s);
  }
  boot();
})();

</script>
